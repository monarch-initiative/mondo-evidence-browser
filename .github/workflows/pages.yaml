# Build the static browser from the mondo-ai packet store and the current Mondo
# release, and deploy it to GitHub Pages. Runs on pushes to main, weekly (to pick up
# new Mondo releases, packets and sign-offs), and on demand. Everything it uses is free.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables), all
# optional; see DEPLOY.md:
#   MEB_SERVICE_URL     URL of the sign-off service (the Vercel deployment)
#   ORCID_CLIENT_ID     ORCID client id for login
#   ORCID_BASE_URL      https://orcid.org for production (default: the sandbox)
#   MEB_DECISIONS_REPO  owner/name of the decisions repository the service writes to
#   MEB_DATA_REPO       owner/name of a Hugging Face dataset to host the data
# Repository secret:
#   HF_TOKEN            Hugging Face token with write access to MEB_DATA_REPO
#
# Without MEB_DATA_REPO the data is published on Pages itself (fine up to ~600K
# records; Pages allows 1 GB per site).
---
name: Deploy to GitHub Pages

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PACKETS_REPOSITORY: semanticly-ai/mondo-ai
  PACKETS_PATH: packet_store_merged

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out the packet store
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PACKETS_REPOSITORY }}
          path: packets
          sparse-checkout: ${{ env.PACKETS_PATH }}
          persist-credentials: false
      - name: Check out the decisions
        if: ${{ vars.MEB_DECISIONS_REPO != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.MEB_DECISIONS_REPO }}
          path: decisions
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install project
        run: |
          uv sync --group deploy
          npm ci
      - name: Fetch the current Mondo release
        run: |
          mkdir -p data
          curl -sSL --fail -o data/mondo.obo https://purl.obolibrary.org/obo/mondo.obo
          grep -m1 '^data-version:' data/mondo.obo
      - name: Build the site (and publish the data)
        env:
          MEB_SERVICE_URL: ${{ vars.MEB_SERVICE_URL }}
          ORCID_CLIENT_ID: ${{ vars.ORCID_CLIENT_ID }}
          ORCID_BASE_URL: ${{ vars.ORCID_BASE_URL || 'https://sandbox.orcid.org' }}
          MEB_DATA_REPO: ${{ vars.MEB_DATA_REPO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$MEB_SERVICE_URL" ]; then unset MEB_SERVICE_URL; fi
          if [ -z "$ORCID_CLIENT_ID" ]; then unset ORCID_CLIENT_ID; fi
          args=(--store "packets/$PACKETS_PATH" --site site)
          if [ -d decisions ]; then args+=(--decisions decisions); fi
          if [ -n "$MEB_DATA_REPO" ] && [ -n "$HF_TOKEN" ]; then
            # Data on Hugging Face, in a folder for this build only.
            url=$(uv run python -c "from mondo_evidence_browser.huggingface import data_url; \
              print(data_url('$MEB_DATA_REPO', '$GITHUB_RUN_ID'))")
            uv run mondo-evidence-browser build "${args[@]}" --data-url "$url" --data-dir data-out
            uv run mondo-evidence-browser publish-hf --data-dir data-out \
              --repo "$MEB_DATA_REPO" --build-id "$GITHUB_RUN_ID"
          else
            # Data on Pages. Pages gzips most content types, which breaks range reads
            # of the database; it leaves images alone, hence the .png name.
            uv run mondo-evidence-browser build "${args[@]}" --db-file evidence.sqlite.png
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
