<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mondo evidence</title>
  <link rel="stylesheet" href="assets/app.css">
  <script src="vendor/sql.js-httpvfs/index.js"></script>
  <script type="module" src="assets/list.js"></script>
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span>Mondo <span class="brand-accent">evidence</span></a>
    <div class="who" id="who"></div>
  </div>
</header>
<main class="wrap">
  <div class="page-head">
    <h1>Evidence records</h1>
    <p class="lede">Claims proposed for Mondo, each scored by the evidence behind it. Curators sign them off to accept or reject them.</p>
  </div>
  <p id="status" class="status">Loading the evidence index…</p>
  <nav id="tabs" class="tabs" role="tablist" aria-label="Record sets"></nav>
  <form id="controls" class="filters" role="search"></form>
  <div id="explainer"></div>
  <p id="count" class="count"></p>
  <p id="notice" class="note" role="status" hidden></p>
  <div id="table"></div>
  <nav id="pager" class="pager" aria-label="Pages"></nav>
</main>
<footer class="wrap foot" id="foot"></footer>
</body>
</html>
