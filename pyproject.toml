[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "mondo_evidence_browser"
description = "Schema-driven browser and sign-off tool for Mondo evidence records."
authors = [
  {name = "Yasemin Bridges", email = "yaseminbridges@gmail.com"},
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dynamic = ["version"]
dependencies = [
  "linkml-runtime>=1.9.4",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0",
  "typer>=0.12.0",
  "pyjwt[crypto]>=2.9",
]

[project.scripts]
mondo-evidence-browser = "mondo_evidence_browser.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "mypy>=1.10",
  "ruff>=0.6",
  "pre-commit>=4.0",
  "types-pyyaml>=6.0",
  "linkml>=1.9.4",
  "pytest-playwright>=0.5",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/mondo_evidence_browser"]

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
  "browser: end-to-end tests that drive a real browser (Playwright)",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = ["LICENSE", "pyproject.toml", "uv.lock", "tests/fixtures/*"]
quiet-level = 3

# Ref.: https://github.com/crate-ci/typos (spell checker)
[tool.typos.files]
extend-exclude = ["LICENSE", "uv.lock", "pyproject.toml", "tests/fixtures/*"]
